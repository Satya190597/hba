<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Aakanksha ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="lanterns" id="lanterns" aria-hidden="true"></div>

  <audio id="bgMusic" src="music/bg_music.mp3" loop preload="auto"></audio>
  <button class="music-toggle" id="musicToggle" aria-label="Play music" title="Play music">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>

  <header class="hero">
    <svg class="up-house" viewBox="0 0 120 170" aria-hidden="true">
      <g stroke="rgba(255,255,255,.35)" stroke-width="0.8">
        <line x1="60" y1="96" x2="38" y2="40"/>
        <line x1="60" y1="96" x2="52" y2="22"/>
        <line x1="60" y1="96" x2="68" y2="26"/>
        <line x1="60" y1="96" x2="84" y2="42"/>
        <line x1="60" y1="96" x2="60" y2="50"/>
      </g>
      <ellipse cx="38" cy="34" rx="9" ry="11" fill="#f2a7b8"/>
      <ellipse cx="52" cy="16" rx="9" ry="11" fill="#f5d48a"/>
      <ellipse cx="68" cy="20" rx="9" ry="11" fill="#a9c9e8"/>
      <ellipse cx="84" cy="36" rx="9" ry="11" fill="#c5b3e6"/>
      <ellipse cx="60" cy="44" rx="9" ry="11" fill="#b5dfc5"/>
      <polygon points="30,122 60,98 90,122" fill="none" stroke="#f5d48a" stroke-width="2" stroke-linejoin="round"/>
      <rect x="36" y="121" width="48" height="34" fill="none" stroke="#f5d48a" stroke-width="2"/>
      <rect x="55" y="136" width="10" height="19" fill="none" stroke="#f5d48a" stroke-width="2"/>
    </svg>

    <p class="eyebrow">Happy Birthday</p>
    <h1 class="name">Aakanksha</h1>
    <p class="subtitle">Adventure is out there — and so is my favourite person.</p>
    <a href="#story" class="btn">Open your cards</a>
  </header>

  <main id="story" class="story">
    <div class="carousel">
      <button class="nav prev" id="prevBtn" aria-label="Previous card">&#8592;</button>
      <div class="track-wrap">
        <div class="track" id="track"></div>
      </div>
      <button class="nav next" id="nextBtn" aria-label="Next card">&#8594;</button>
    </div>
    <div class="dots" id="dots"></div>
  </main>

  <section class="finale" id="finale" hidden>
    <p class="quote">"You were my new dream."</p>
    <p>Thank you for being the greatest adventure of my life.</p>
  </section>

  <footer>Made with love, just for you</footer>

  <script src="script.js"></script>
</body>
</html>
